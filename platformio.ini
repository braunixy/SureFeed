; PlatformIO Project Configuration for SureFeed Microchip Pet Feeder
; Microcontroller: STM32L071VZT6 (192KB Flash, 20KB SRAM, 6KB EEPROM)

[platformio]
default_envs = release

[env:surefeed]
platform = ststm32
board = surefeed_l071vz
framework = stm32cube

; Build settings
build_type = debug
build_flags = 
    -DSTM32L071xx
    -DUSE_HAL_DRIVER
    -DUSE_FULL_LL_DRIVER
    -g3
    -Og
    -Wall

; Black Magic Probe (uncomment and set your serial port or Wi-Fi host:port)
upload_protocol = blackmagic
debug_tool = blackmagic
; upload_port = 192.168.1.100:2345
; debug_port = 192.168.1.100:2345

[env:release]
platform = ststm32
board = surefeed_l071vz
framework = stm32cube
build_type = release
build_flags =
    -DSTM32L071xx
    -DUSE_HAL_DRIVER
    -DUSE_FULL_LL_DRIVER
    -Os
    -Wall
upload_protocol = stlink
