; PlatformIO Project Configuration for SureFeed Microchip Pet Feeder
; Microcontroller: STM32L071VZT6 (192KB Flash, 20KB SRAM, 6KB EEPROM)

[env:surefeed]
platform = ststm32
board = surefeed_l071vz
framework = stm32cube

; Build settings
build_type = debug
build_flags = 
    -DSTM32L071xx
    -DUSE_HAL_DRIVER
    -DUSE_FULL_LL_DRIVER
    -g3
    -Og
    -Wall

; Black Magic Probe over WiFi
upload_protocol = blackmagic
upload_port = 192.168.2.216:2345
debug_tool = blackmagic
debug_port = 192.168.2.216:2345
