name: Build & Publish Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag name (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO
        run: pip install --upgrade platformio

      - name: Build release firmware
        run: pio run -e release

      - name: Package release artifacts
        run: |
          mkdir -p dist
          cp .pio/build/release/firmware.bin dist/surefeed-firmware.bin
          cp .pio/build/release/firmware.elf dist/surefeed-firmware.elf
          OBJCOPY="$(find "$HOME/.platformio/packages" -name 'arm-none-eabi-objcopy' -type f | head -n 1)"
          "$OBJCOPY" -O ihex .pio/build/release/firmware.elf dist/surefeed-firmware.hex
          (cd dist && sha256sum surefeed-firmware.bin surefeed-firmware.elf surefeed-firmware.hex > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: SureFeed Firmware ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            dist/surefeed-firmware.bin
            dist/surefeed-firmware.hex
            dist/surefeed-firmware.elf
            dist/SHA256SUMS.txt
